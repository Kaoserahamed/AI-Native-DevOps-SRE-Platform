name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint-typecheck:
    name: Python lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy .

  python-tests:
    name: Python tests with coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.x"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --all-extras

      - name: Run pytest with 70 percent coverage gate
        run: uv run pytest --cov=packages --cov=services --cov-fail-under=70

  frontend-verify:
    name: Frontend lint, format, typecheck and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@50df6cbea8f2c9cee43a8f88b77ba21f3f7129e1 # v4.5.1
        with:
          node-version: "20"
          cache: "npm"

      # The lockfile lives at the repository root and apps/demo-app/frontend is an npm
      # workspace, so `npm ci` must run at the root; `npm run verify` then targets the
      # frontend workspace under apps/demo-app/frontend.
      - name: Install Node dependencies
        run: npm ci

      - name: Verify frontend workspace
        run: npm run verify --workspace @demo-app/frontend
