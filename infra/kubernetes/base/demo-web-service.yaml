# ClusterIP service for the demo frontend. It is the only workload the Ingress publishes.
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo-web
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
