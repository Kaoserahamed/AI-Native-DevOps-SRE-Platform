# Non-secret configuration for the demo API.
#
# Nothing here is sensitive: connection strings and credentials arrive through the `demo-api-secrets`
# Secret reference on the Deployment, never as ConfigMap data (docs/12-kubernetes.md, ADR-0004).
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-api-config
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: kustomize
data:
  APP_NAME: demo-api
  # Base values are production shaped; overlays set the environment they deploy (development enables the
  # test-only failure modes below, staging and production never may).
  APP_ENV: production
  LOG_LEVEL: INFO
  HOST: 0.0.0.0
  PORT: "8000"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  # A blank value means "not configured" (see docs/04-configuration.md): traces are written to the process
  # log until the OpenTelemetry collector pipeline exists (Task 5.2), and failure injection is disabled
  # outside development because the settings model rejects it everywhere else.
  OTEL_ENDPOINT: ""
  FAILURE_MODE: ""
  FAILURE_RATE: "1.0"
