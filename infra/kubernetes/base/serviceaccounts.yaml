# Service accounts for the demo workloads.
#
# Least privilege here means *no* Kubernetes API access: neither workload ever calls the API server, so no
# Role or RoleBinding is granted at all and the projected token is not mounted. The identities exist so the
# pods are attributable in audit logs and can be referenced by policies (the NetworkPolicies in this
# directory select pods, and admission policy can allowlist these accounts), not because they need
# permissions. A future component that *does* need the API must add a narrowly scoped Role with explicit
# verbs and resources, reviewed as its own change.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-api
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-web
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: demo-app
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
