# Docker Compose for local development
# 
# Usage:
#   docker-compose up -d      # Start all services
#   docker-compose logs -f    # View logs
#   docker-compose down       # Stop all services

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: devops_platform
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d devops_platform"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - platform

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - platform

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.143.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - platform

  demo-api:
    build:
      context: .
      dockerfile: services/demo_api/Dockerfile
      args:
        APP_VERSION: 0.0.0
        VCS_REF: dev
    image: demo-api:dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://demo:demo@postgres:5432/devops_platform
      REDIS_URL: redis://redis:6379/0
      OTEL_ENDPOINT: http://otel-collector:4317
      HOST: 0.0.0.0
      PORT: 8000
      APP_ENV: development
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    networks:
      - platform
    restart: unless-stopped
